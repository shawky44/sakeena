name: azkar_app
description: "A Flutter prayer app with notifications"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  #  flutter_localizations
  flutter_localizations:
    sdk: flutter

  # Core functionality
  share_plus: ^7.2.0
  http: ^1.1.0
  flutter_compass: ^0.8.0
  geolocator: ^13.0.4
  vibration: ^3.1.4
  audioplayers: ^5.2.1
  android_alarm_manager_plus: ^5.0.0
  device_preview: ^1.3.1
  flutter_timezone: ^3.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  adhan_dart: 1.1.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  table_calendar: ^3.1.0
  hijri: ^3.0.0
  shared_preferences: ^2.2.2
  geocoding: ^3.0.0
  adhan: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
