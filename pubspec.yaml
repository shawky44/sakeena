name: azkar_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  device_preview: ^1.2.0

  # Alarm & Background
  android_alarm_manager_plus: ^4.0.1
  workmanager: 0.6.0

  # Localization & Date
  intl: ^0.20.2
  hijri: ^3.0.0
  
  # Location & Prayer Times
  location: ^7.0.0
  adhan_dart: ^1.1.2
  
  # Storage
  shared_preferences: ^2.3.2
  
  # Audio
  audioplayers: ^6.1.0
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  
  flutter_localizations:
    sdk: flutter
  table_calendar: ^3.2.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_compass: ^0.8.1
  vibration: ^3.1.4
  in_app_update: ^4.2.5
  package_info_plus: ^8.3.1
  url_launcher: ^6.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/audios/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
